name: Deploy Backend to AWS EC2 (Self-Hosted Runner)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/src/**'
      - 'backend/requirements.txt'
      - 'backend/Dockerfile'
      - '.github/workflows/main.yaml'

jobs:
  deploy:
    runs-on: self-hosted # Runs directly on your EC2 instance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Environment Secrets File
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env

      - name: Build Docker Image
        run: |
          docker build -t patching-agent-backend:latest ./backend

      - name: Stop Existing Container
        run: |
          docker stop patching-backend || true
          docker rm patching-backend || true

      - name: Run Updated Container
        run: |
          docker run -d \
            --name patching-backend \
            --restart always \
            -p 8000:8000 \
            --env-file .env \
            patching-agent-backend:latest

      - name: Prune Old Docker Images
        run: |
          docker image prune -f