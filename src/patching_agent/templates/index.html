<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - API Patching Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between p-6 min-h-screen shrink-0">
        <div class="space-y-6">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🤖</span>
                <h1 class="text-base font-bold text-white tracking-tight">API Patching Agent</h1>
            </div>

            <nav class="space-y-1">
                <a href="/" 
                   class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active_page == 'dashboard' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-400 hover:bg-slate-900 hover:text-white{% endif %}">
                    <span>🚀</span>
                    <span>New Repair Job</span>
                </a>
                <a href="/history" 
                   class="flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active_page == 'history' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-400 hover:bg-slate-900 hover:text-white{% endif %}">
                    <span>📜</span>
                    <span>Repair History</span>
                </a>
            </nav>
        </div>

        <div class="border-t border-slate-800 pt-4 space-y-3">
            <div class="text-xs text-slate-400">
                Logged in as: <strong class="text-indigo-300 block text-sm font-semibold truncate">{{ username }}</strong>
            </div>
            <a href="/auth/logout" class="block w-full text-center bg-red-950/40 hover:bg-red-900/60 text-red-300 text-xs py-2 rounded-lg border border-red-800/50 transition-colors">
                Sign Out
            </a>
        </div>
    </aside>

    <!-- Main Application Canvas -->
    <main class="flex-1 p-8 grid grid-cols-1 lg:grid-cols-2 gap-8 overflow-y-auto">
        
        <!-- Input Diagnostics Panel -->
        <section class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 shadow-xl h-fit">
            <h2 class="text-lg font-semibold text-white mb-4">📥 Inbound Failure Diagnostics</h2>
            
            <form id="repair-form" 
                  hx-post="/api/repair-html" 
                  hx-target="#execution-status-container" 
                  hx-swap="innerHTML"
                  class="space-y-4">

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Target Broken File Path</label>
                    <input type="text" name="target_file_path" value="src/sample_api.py" required
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Raw API Exception Logs / Traceback Dump</label>
                    <textarea name="raw_logs" rows="5" required placeholder="Paste traceback here..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Original Broken Codebase Content</label>
                    <textarea name="original_code" rows="8" required placeholder="Paste broken code here..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-600/30">
                    🚀 Execute Autonomous Repair Loop
                </button>
            </form>
        </section>

        <!-- Status & Output Panel -->
        <section class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 shadow-xl flex flex-col h-fit min-h-[400px]">
            <h2 class="text-lg font-semibold text-white mb-4">🧠 Agentic Lifecycle Orchestration</h2>
            <div id="execution-status-container" class="flex-1 flex flex-col items-center justify-center text-slate-500 text-sm min-h-[300px]">
                <div class="text-center space-y-2">
                    <p class="text-3xl">⚙️</p>
                    <p>System Idle. Submit a repair request to initialize the repair pipeline.</p>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
